<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#06243d">
  <title>Kiwi Feud</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#03111d}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#16557f,#061827 48%,#02070c)}
    main{width:min(1050px,94vw);margin:auto;padding:24px 0 60px}.hero{text-align:center;margin-bottom:22px}.hero h1{margin:0;color:#ffd447;font-size:clamp(42px,9vw,88px);text-transform:uppercase;text-shadow:0 5px 0 #7a3b00}.hero p{color:#b8cddd}
    .game{display:grid;grid-template-columns:210px 1fr 210px;gap:14px}.panel,.board{background:linear-gradient(#123d61,#071d31);border:1px solid #ffffff26;border-radius:18px;padding:14px;box-shadow:0 20px 50px #0007}.board{border:5px solid #ffd447}.team{text-align:center}.team input{width:100%;background:transparent;border:0;border-bottom:1px dashed #ffffff55;color:#fff;text-align:center;font-size:20px;font-weight:800}.score{font-size:58px;font-weight:1000;color:#ffd447}.question{text-align:center;font-size:clamp(22px,4vw,38px);font-weight:900;margin:6px 0 18px}.answers{display:grid;gap:9px}.answer{display:grid;grid-template-columns:45px 1fr 60px;align-items:center;min-height:56px;border:2px solid #fff0a7;border-radius:10px;overflow:hidden;background:linear-gradient(#1b659d,#0a2d4c);color:white;font-weight:900}.answer.revealed{background:linear-gradient(#ffe273,#efa814);color:#241600}.answer span{padding:10px}.answer .rank,.answer .points{text-align:center;background:#0002}.answer:not(.revealed) .text,.answer:not(.revealed) .points{visibility:hidden}
    .controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}.btn{border:0;border-radius:11px;padding:11px 14px;background:#1a527e;color:#fff;font-weight:850}.btn.gold{background:linear-gradient(#ffe273,#efa814);color:#211500}.btn.red{background:#e83b4b}.strikes{text-align:center;font-size:58px;color:#ee3344;min-height:70px}.small{color:#9fb8ca;font-size:13px}.ready{padding:10px;border-radius:10px;background:#ffffff0d;text-align:center}
    @media(max-width:850px){.game{grid-template-columns:1fr}.board{order:-1}.panel{display:grid;grid-template-columns:1fr 1fr;gap:12px}}@media(max-width:520px){.panel{grid-template-columns:1fr}.answer{grid-template-columns:38px 1fr 52px}.hero h1{font-size:44px}}
  </style>
</head>
<body>
<main>
  <header class="hero"><h1>🥝 Kiwi Feud</h1><p>Aotearoa family gameshow — first deploy</p></header>
  <section class="game">
    <aside class="panel">
      <div class="team"><input id="teamA" value="Kea"><div class="score" id="scoreA">0</div><button class="btn" onclick="addScore('A',10)">+10</button></div>
      <div class="team"><input id="teamB" value="Tūī"><div class="score" id="scoreB">0</div><button class="btn" onclick="addScore('B',10)">+10</button></div>
    </aside>
    <section class="board">
      <div class="small" id="category">READY</div>
      <div class="question" id="question">Press New Question to begin</div>
      <div class="answers" id="answers"></div>
      <div class="strikes" id="strikes"></div>
      <div class="controls"><button class="btn red" onclick="strike()">Strike</button><button class="btn gold" onclick="newQuestion()">New Question</button><button class="btn" onclick="revealAll()">Reveal All</button></div>
    </section>
    <aside class="panel"><div class="ready"><strong>Netlify-ready</strong><p class="small">This starter is live-code ready. Every push to <code>main</code> can trigger a rebuild.</p></div><button class="btn" onclick="document.documentElement.requestFullscreen?.()">Fullscreen</button></aside>
  </section>
</main>
<script>
const bank=[
 {c:'Kai & BBQ',q:'Name something you would cook on a Kiwi BBQ.',a:[['Sausages',31],['Steak',24],['Burger patties',18],['Chicken',15],['Corn',12]]},
 {c:'Summer',q:'Name something you take to the beach.',a:[['Towel',29],['Sunscreen',26],['Togs',19],['Food',15],['Umbrella',11]]},
 {c:'Everyday Kiwi',q:'Name something people buy from the dairy.',a:[['Milk',28],['Lollies',24],['Ice cream',19],['Bread',16],['Pie',13]]},
 {c:'Sport',q:'Name something you hear at a rugby match.',a:[['Go!',28],['Ref!',24],['Cheering',20],['Whistle',16],['National anthem',12]]},
 {c:'Aotearoa',q:'Name a te reo Māori word many New Zealanders use.',a:[['Kia ora',35],['Whānau',23],['Kai',18],['Mahi',14],['Aroha',10]]}
];
let strikes=0,last=-1,scores={A:0,B:0};
function newQuestion(){let i;do{i=Math.floor(Math.random()*bank.length)}while(i===last&&bank.length>1);last=i;strikes=0;drawStrikes();const x=bank[i];category.textContent=x.c.toUpperCase();question.textContent=x.q;answers.innerHTML=x.a.map((v,n)=>`<button class="answer" onclick="this.classList.add('revealed')"><span class="rank">${n+1}</span><span class="text">${v[0]}</span><span class="points">${v[1]}</span></button>`).join('')}
function revealAll(){document.querySelectorAll('.answer').forEach(x=>x.classList.add('revealed'))}
function strike(){strikes=Math.min(3,strikes+1);drawStrikes()}
function drawStrikes(){document.getElementById('strikes').textContent='✕'.repeat(strikes)}
function addScore(t,n){scores[t]+=n;document.getElementById('score'+t).textContent=scores[t]}
</script>
</body>
</html>
