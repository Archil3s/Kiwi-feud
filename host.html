<!doctype html><html lang="en-NZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kiwi Feud — Host</title><style>:root{--navy:#0b2945;--gold:#e9a91d;--paper:#f7efdc;--ink:#1c2a36;--red:#d93a4d;--green:#238b59}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{background:#0a1d30;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;padding:12px}main{width:min(760px,100%);margin:auto}.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;margin-bottom:12px}.top h1{min-width:0;margin:0;color:#ffd24b;font-size:clamp(24px,5vw,34px);overflow-wrap:anywhere}.card{background:var(--paper);color:var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px #0008}.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#173f68;color:#fff;padding:12px 14px;font-weight:1000;text-transform:uppercase;letter-spacing:.08em}.question{padding:18px;text-align:center;font:700 clamp(21px,4vw,34px)/1.18 Georgia,serif;border-bottom:1px solid #d7c89f;overflow-wrap:anywhere;word-break:normal;hyphens:auto}.answers{padding:12px;display:grid;gap:8px}.answer{display:grid;grid-template-columns:42px minmax(0,1fr) 58px;align-items:stretch;border:1px solid #cbb986;border-radius:9px;background:#fff;overflow:hidden;font-weight:850;min-height:50px;color:var(--ink)}.answer.done{opacity:.45}.answer span{min-width:0;padding:9px;display:flex;align-items:center;overflow-wrap:anywhere;word-break:normal;hyphens:auto;line-height:1.15}.answer .n,.answer .p{justify-content:center;text-align:center;background:#efe1ba}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;background:#eadfc4}.btn{border:0;border-radius:11px;padding:12px;background:#174e78;color:white;font-weight:900;white-space:normal;line-height:1.15}.gold{background:linear-gradient(#ffd76a,#e9a91d);color:#241700}.red{background:var(--red)}.green{background:var(--green)}.panel{margin-top:12px;background:#102f4e;border-radius:14px;padding:12px;display:grid;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:5px}.field label{font-size:11px;color:#a9c3d5;text-transform:uppercase;font-weight:900}.field input,.field select{width:100%;min-width:0;padding:10px;border-radius:9px;border:1px solid #ffffff24;background:#061b2d;color:white}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{min-width:0;padding:10px;border-radius:10px;background:#061b2d;text-align:center}.stat small{display:block;color:#9eb7c8;overflow-wrap:anywhere}.stat b{font-size:24px;color:#ffd24b}.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}.team{min-width:0;padding:10px;border:2px solid transparent;border-radius:11px;background:#061b2d}.team.active{border-color:#ffd24b}.team input{width:100%;min-width:0;background:transparent;border:0;border-bottom:1px dashed #ffffff44;color:#fff;text-align:center;font-weight:900}.score{font-size:34px;color:#ffd24b;text-align:center;font-weight:1000}.tiny{display:flex;gap:6px}.tiny .btn{flex:1;padding:8px}.status{font-size:12px;color:#b6ccda;text-align:center;line-height:1.4}@media(max-width:540px){body{padding:7px}.top{grid-template-columns:auto minmax(0,1fr)}.top button{grid-column:1/-1;width:100%}.controls,.grid,.teams{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.question{font-size:clamp(20px,6vw,27px);padding:15px 12px}.answer{grid-template-columns:38px minmax(0,1fr) 50px}.answer span{padding:8px 6px;font-size:14px}}@media(max-width:350px){.stats{grid-template-columns:1fr}.head{font-size:11px}}</style></head><body><main><div class="top"><div>🎙️</div><h1>Host Console</h1><button class="btn" onclick="openAudience()">Open Audience</button></div><section class="card"><div class="head"><span id="qnum">QUESTION CARD</span><span id="cat">READY</span></div><div class="question" id="question">Choose New Question to begin.</div><div class="answers" id="answers"></div><div class="controls"><button class="btn red" onclick="strike()">Add Strike</button><button class="btn" onclick="switchTeam()">Switch Team</button><button class="btn gold" id="award" onclick="award()">Award 0 Points</button><button class="btn green" onclick="nextQuestion()">New Question</button></div></section><section class="panel"><div class="stats"><div class="stat"><small>Base</small><b id="base">0</b></div><div class="stat"><small>Multiplier</small><b id="mult">×1</b></div><div class="stat"><small>Total</small><b id="total">0</b></div></div><div class="grid"><div class="field"><label>Question category</label><select id="category"></select></div><div class="field"><label>Round multiplier</label><select id="multiplier"><option value="1">Single ×1</option><option value="2">Double ×2</option><option value="3">Triple ×3</option></select></div></div><div class="teams"><div class="team" id="team0"><input><div class="score">0</div><div class="tiny"><button class="btn" onclick="adjust(0,-5)">−5</button><button class="btn" onclick="adjust(0,5)">+5</button></div></div><div class="team" id="team1"><input><div class="score">0</div><div class="tiny"><button class="btn" onclick="adjust(1,-5)">−5</button><button class="btn" onclick="adjust(1,5)">+5</button></div></div></div><div class="grid"><button class="btn" onclick="clearAnswers()">Cover Answers</button><button class="btn red" onclick="resetGame()">Reset Game</button></div><div class="status">Keep this page private. The audience screen updates instantly in another tab or popup on the same device.</div></section></main><script src="game-data.js"></script><script>const $=id=>document.getElementById(id);let state=KiwiSync.get();const cats=['All categories',...new Set(KIWI_FEUD_BANK.map(q=>q.c))];$('category').innerHTML=cats.map(c=>`<option>${c}</option>`).join('');function openAudience(){window.open('play.html','kiwiFeudAudience','popup=yes,width=1100,height=760,resizable=yes')}function q(){return KIWI_FEUD_BANK[state.questionIndex]}function totals(){const x=q();const base=x?state.revealed.reduce((n,i)=>n+x.a[i][1],0):0;return{base,total:base*state.multiplier}}function render(s){state=s;const x=q();[0,1].forEach(i=>{const t=$('team'+i);t.classList.toggle('active',s.activeTeam===i);t.querySelector('input').value=s.teamNames[i];t.querySelector('.score').textContent=s.scores[i]});$('multiplier').value=s.multiplier;if(!x){$('qnum').textContent='QUESTION CARD';$('cat').textContent='READY';$('question').textContent='Choose New Question to begin.';$('answers').innerHTML=''}else{$('qnum').textContent='QUESTION '+(s.questionIndex+1);$('cat').textContent=x.c;$('question').textContent=x.q;$('answers').innerHTML=x.a.map((a,i)=>`<button class="answer ${s.revealed.includes(i)?'done':''}" onclick="reveal(${i})"><span class="n">${i+1}</span><span>${a[0]}</span><span class="p">${a[1]}</span></button>`).join('')}const t=totals();$('base').textContent=t.base;$('mult').textContent='×'+s.multiplier;$('total').textContent=t.total;$('award').textContent=s.roundAwarded?'Points Awarded':`Award ${t.total} Points`}function reveal(i){if(state.roundAwarded||state.revealed.includes(i))return;KiwiSync.set({revealed:[...state.revealed,i]})}function nextQuestion(){const cat=$('category').value;const pool=KIWI_FEUD_BANK.map((q,i)=>({q,i})).filter(x=>(cat==='All categories'||x.q.c===cat)&&x.i!==state.questionIndex);const pick=pool[Math.floor(Math.random()*pool.length)]||{i:0};KiwiSync.set({questionIndex:pick.i,revealed:[],strikes:0,roundAwarded:false})}function strike(){KiwiSync.set({strikes:Math.min(3,state.strikes+1)})}function switchTeam(){KiwiSync.set({activeTeam:1-state.activeTeam})}function award(){const t=totals();if(!t.total||state.roundAwarded)return;const scores=[...state.scores];scores[state.activeTeam]+=t.total;KiwiSync.set({scores,roundAwarded:true})}function clearAnswers(){KiwiSync.set({revealed:[],roundAwarded:false})}function adjust(i,n){const scores=[...state.scores];scores[i]=Math.max(0,scores[i]+n);KiwiSync.set({scores})}function resetGame(){if(confirm('Reset the whole game?'))KiwiSync.reset()}$('multiplier').onchange=e=>KiwiSync.set({multiplier:Number(e.target.value)});document.querySelectorAll('.team input').forEach((input,i)=>input.onchange=()=>{const names=[...state.teamNames];names[i]=input.value||`Team ${i+1}`;KiwiSync.set({teamNames:names})});KiwiSync.subscribe(render);</script></body></html>
