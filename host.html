<!doctype html><html lang="en-NZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kiwi Feud — Host</title><style>:root{--gold:#ffd24b;--paper:#f7efdc;--ink:#1c2a36;--red:#d93a4d;--green:#238b59;--blue:#174e78}*{box-sizing:border-box}body{margin:0;background:#081b2d;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:12px}main{width:min(820px,100%);margin:auto}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.top h1{margin:0;color:var(--gold);font-size:clamp(24px,5vw,36px)}.top .btn{margin-left:auto}.btn{border:0;border-radius:11px;padding:11px 13px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer}.gold{background:linear-gradient(#ffe17d,#e7a51b);color:#241700}.red{background:var(--red)}.green{background:var(--green)}.ghost{background:#ffffff12}.card{background:var(--paper);color:var(--ink);border-radius:15px;overflow:hidden;box-shadow:0 20px 60px #0008}.head{display:flex;justify-content:space-between;background:#173f68;color:#fff;padding:12px 14px;font-weight:1000;text-transform:uppercase;letter-spacing:.08em}.question{padding:18px;text-align:center;font:700 clamp(22px,4vw,34px) Georgia,serif;border-bottom:1px solid #d7c89f;overflow-wrap:anywhere}.answers{padding:12px;display:grid;gap:8px}.answer{display:grid;grid-template-columns:42px minmax(0,1fr) 58px;align-items:stretch;border:1px solid #cbb986;border-radius:9px;background:#fff;overflow:hidden;font-weight:850;min-height:50px;color:var(--ink)}.answer.done{opacity:.45}.answer span{padding:9px;display:flex;align-items:center}.answer .n,.answer .p{justify-content:center;background:#efe1ba}.answer .label{overflow-wrap:anywhere}.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px;background:#eadfc4}.panel{margin-top:12px;background:#102f4e;border-radius:14px;padding:12px;display:grid;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:5px}.field label{font-size:11px;color:#a9c3d5;text-transform:uppercase;font-weight:900}.field input,.field select{width:100%;padding:10px;border-radius:9px;border:1px solid #ffffff24;background:#061b2d;color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:10px;border-radius:10px;background:#061b2d;text-align:center}.stat small{display:block;color:#9eb7c8}.stat b{font-size:24px;color:var(--gold)}.team-manager{display:grid;gap:8px}.team-row{display:grid;grid-template-columns:auto minmax(0,1fr) 76px auto;gap:8px;align-items:center;padding:9px;border:2px solid transparent;border-radius:12px;background:#061b2d}.team-row.active{border-color:var(--gold);box-shadow:0 0 18px #ffd24b35}.select-team{width:38px;height:38px;border-radius:50%;border:2px solid #ffffff55;background:#0d3c61;color:#fff;font-weight:1000}.team-row.active .select-team{background:var(--gold);color:#251700;border-color:#fff0aa}.team-name{min-width:0}.team-score{font-size:27px;color:var(--gold);font-weight:1000;text-align:center}.team-actions{display:flex;gap:5px}.team-actions .btn{padding:8px 9px}.team-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.active-banner{padding:11px;border-radius:11px;background:#0a2238;text-align:center;color:#c8dce9}.active-banner strong{color:var(--gold)}.status{font-size:12px;color:#b6ccda;text-align:center}@media(max-width:560px){.controls,.grid,.team-tools{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.team-row{grid-template-columns:auto minmax(0,1fr) 58px}.team-actions{grid-column:2/4}.top .btn{padding:9px}.question{font-size:24px}}</style></head><body><main><div class="top"><div>🎙️</div><h1>Host Console</h1><button class="btn" onclick="openAudience()">Open Audience</button></div><section class="card"><div class="head"><span id="qnum">QUESTION CARD</span><span id="cat">READY</span></div><div class="question" id="question">Choose New Question to begin.</div><div class="answers" id="answers"></div><div class="controls"><button class="btn red" onclick="strike()">Add Strike</button><button class="btn" onclick="selectNextTeam()">Next Team</button><button class="btn gold" id="award" onclick="award()">Award 0 Points</button><button class="btn green" onclick="nextQuestion()">New Question</button></div></section><section class="panel"><div class="active-banner">Points will go to: <strong id="activeName">Kea</strong></div><div class="stats"><div class="stat"><small>Base</small><b id="base">0</b></div><div class="stat"><small>Multiplier</small><b id="mult">×1</b></div><div class="stat"><small>Total</small><b id="total">0</b></div></div><div class="grid"><div class="field"><label>Question category</label><select id="category"></select></div><div class="field"><label>Round multiplier</label><select id="multiplier"><option value="1">Single ×1</option><option value="2">Double ×2</option><option value="3">Triple ×3</option></select></div></div><div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><strong>Teams</strong><small style="color:#a9c3d5">Tap the circle to select</small></div><div class="team-manager" id="teams"></div></div><div class="team-tools"><button class="btn green" onclick="addTeam()">＋ Add Team</button><button class="btn ghost" onclick="selectNextTeam()">Cycle Active Team</button></div><div class="grid"><button class="btn" onclick="clearAnswers()">Cover Answers</button><button class="btn red" onclick="resetGame()">Reset Game</button></div><div class="status">Supports 2–6 teams. The highlighted team receives the round points.</div></section></main><script src="game-data.js"></script><script>const $=id=>document.getElementById(id);let state=KiwiSync.get();const cats=['All categories',...new Set(KIWI_FEUD_BANK.map(q=>q.c))];$('category').innerHTML=cats.map(c=>`<option>${c}</option>`).join('');function openAudience(){window.open('play.html','kiwiFeudAudience','popup=yes,width=1100,height=760,resizable=yes')}function q(){return KIWI_FEUD_BANK[state.questionIndex]}function totals(){const x=q(),base=x?state.revealed.reduce((n,i)=>n+(x.a[i]?.[1]||0),0):0;return{base,total:base*state.multiplier}}function render(s){state=s;const x=q();$('multiplier').value=s.multiplier;$('activeName').textContent=s.teams[s.activeTeam]?.name||'Team';$('teams').innerHTML=s.teams.map((t,i)=>`<div class="team-row ${s.activeTeam===i?'active':''}"><button class="select-team" onclick="selectTeam(${i})" aria-label="Select ${t.name}">${i+1}</button><input class="field team-name" value="${escapeHtml(t.name)}" onchange="renameTeam(${i},this.value)" maxlength="24"><div class="team-score">${t.score}</div><div class="team-actions"><button class="btn" onclick="adjust(${i},-5)">−5</button><button class="btn" onclick="adjust(${i},5)">+5</button>${s.teams.length>2?`<button class="btn red" onclick="removeTeam(${i})">×</button>`:''}</div></div>`).join('');if(!x){$('qnum').textContent='QUESTION CARD';$('cat').textContent='READY';$('question').textContent='Choose New Question to begin.';$('answers').innerHTML=''}else{$('qnum').textContent='QUESTION '+(s.questionIndex+1);$('cat').textContent=x.c;$('question').textContent=x.q;$('answers').innerHTML=x.a.map((a,i)=>`<button class="answer ${s.revealed.includes(i)?'done':''}" onclick="reveal(${i})"><span class="n">${i+1}</span><span class="label">${a[0]}</span><span class="p">${a[1]}</span></button>`).join('')}const t=totals();$('base').textContent=t.base;$('mult').textContent='×'+s.multiplier;$('total').textContent=t.total;$('award').textContent=s.roundAwarded?'Points Awarded':`Award ${t.total} Points`}function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function reveal(i){if(state.roundAwarded||state.revealed.includes(i))return;KiwiSync.set({revealed:[...state.revealed,i]})}function nextQuestion(){const cat=$('category').value;let pool=KIWI_FEUD_BANK.map((q,i)=>({q,i})).filter(x=>(cat==='All categories'||x.q.c===cat)&&!state.usedQuestions.includes(x.i));if(!pool.length){KiwiSync.set({usedQuestions:[]});pool=KIWI_FEUD_BANK.map((q,i)=>({q,i})).filter(x=>cat==='All categories'||x.q.c===cat)}const pick=pool[Math.floor(Math.random()*pool.length)]||{i:0};KiwiSync.set({questionIndex:pick.i,revealed:[],strikes:0,roundAwarded:false,usedQuestions:[...state.usedQuestions,pick.i]})}function strike(){KiwiSync.set({strikes:Math.min(3,state.strikes+1)})}function selectTeam(i){KiwiSync.set({activeTeam:i})}function selectNextTeam(){KiwiSync.set({activeTeam:(state.activeTeam+1)%state.teams.length})}function award(){const t=totals();if(!t.total||state.roundAwarded)return;const teams=state.teams.map((x,i)=>i===state.activeTeam?{...x,score:x.score+t.total}:x);KiwiSync.set({teams,roundAwarded:true})}function clearAnswers(){KiwiSync.set({revealed:[],roundAwarded:false})}function adjust(i,n){const teams=state.teams.map((x,j)=>j===i?{...x,score:Math.max(0,x.score+n)}:x);KiwiSync.set({teams})}function renameTeam(i,name){const teams=state.teams.map((x,j)=>j===i?{...x,name:(name.trim()||`Team ${i+1}`).slice(0,24)}:x);KiwiSync.set({teams})}function addTeam(){if(state.teams.length>=6)return alert('Maximum of 6 teams.');const defaults=['Kākāpō','Pūkeko','Koru','Kiwi'];const teams=[...state.teams,{name:defaults[state.teams.length-2]||`Team ${state.teams.length+1}`,score:0}];KiwiSync.set({teams,activeTeam:teams.length-1})}function removeTeam(i){if(state.teams.length<=2)return;const teams=state.teams.filter((_,j)=>j!==i);let active=state.activeTeam;if(i<active)active--;else if(i===active)active=Math.min(active,teams.length-1);KiwiSync.set({teams,activeTeam:active})}function resetGame(){if(confirm('Reset scores, teams and the whole game?'))KiwiSync.reset()}$('multiplier').onchange=e=>KiwiSync.set({multiplier:Number(e.target.value)});KiwiSync.subscribe(render);</script></body></html>
