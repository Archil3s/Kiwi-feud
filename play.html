<!doctype html><html lang="en-NZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kiwi Feud — Audience</title><style>:root{--gold:#ffd24b;--red:#ef4056;--muted:#a7c3d8}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:radial-gradient(circle at 50% -20%,#2d82b6,#0a2943 40%,#020810 82%);display:grid;place-items:center;padding:12px}.stage{width:min(1280px,100%)}header{display:flex;align-items:center;gap:12px;margin-bottom:12px}.logo{font-size:34px}.title{font-size:clamp(28px,5vw,55px);font-weight:1000;color:var(--gold);text-transform:uppercase;text-shadow:0 4px #704000}.scores{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.team{padding:8px 12px;border-radius:13px;background:#08253e;border:2px solid transparent;min-width:104px;max-width:180px;text-align:center;transition:.2s}.team.active{border-color:var(--gold);box-shadow:0 0 25px #ffd24b55;transform:translateY(-2px)}.team span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}.team b{display:block;color:var(--gold);font-size:28px}.shell{padding:9px;border-radius:30px;background:linear-gradient(145deg,#fff19f,#efa017 45%,#754000);box-shadow:0 0 0 3px #4d2900,0 30px 80px #0009}.board{min-height:650px;padding:22px;border-radius:22px;background:radial-gradient(circle at top,#1b689f,#082b49 55%,#041724);border:2px solid #ffffff35}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:900;letter-spacing:.12em;text-transform:uppercase}.question{min-height:120px;display:grid;place-items:center;text-align:center;font-size:clamp(28px,4vw,52px);font-weight:1000;line-height:1.08;overflow-wrap:anywhere;padding:8px}.answers{display:grid;gap:10px}.answer{display:grid;grid-template-columns:56px minmax(0,1fr) 74px;align-items:stretch;min-height:65px;border-radius:13px;overflow:hidden;border:2px solid #ffeca2;background:linear-gradient(#19689e,#082d4d);font-weight:1000;box-shadow:inset 0 -5px #0004}.answer.revealed{background:linear-gradient(#fff08f,#efa91a);color:#251700;animation:flip .45s ease}@keyframes flip{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}.rank,.points{height:100%;display:grid;place-items:center;background:#0002;font-size:24px}.text{text-align:center;text-transform:uppercase;font-size:clamp(17px,2vw,26px);display:flex;align-items:center;justify-content:center;padding:8px;overflow-wrap:anywhere}.answer:not(.revealed) .text,.answer:not(.revealed) .points{visibility:hidden}.bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:15px}.strikes{text-align:right}.strike{font-size:58px;color:#ffffff1c;font-weight:1000;text-shadow:0 4px #680000}.strike.on{color:var(--red)}.pot{text-align:center;background:#031421;border:1px solid #ffffff22;border-radius:14px;padding:9px 18px}.pot strong{display:block;color:var(--gold);font-size:30px}.pot small{color:var(--muted)}@media(max-width:850px){header{align-items:flex-start;flex-wrap:wrap}.scores{width:100%;margin-left:0;justify-content:center}.team{flex:1;min-width:95px}.board{min-height:auto}}@media(max-width:700px){.board{padding:12px}.question{min-height:95px;font-size:25px}.answer{grid-template-columns:42px minmax(0,1fr) 55px;min-height:53px}.text{font-size:14px}.bottom{grid-template-columns:1fr}.strikes{text-align:center}.title{font-size:34px}.team b{font-size:23px}}</style></head><body><main class="stage"><header><div class="logo">🥝</div><div class="title">Kiwi Feud</div><div class="scores" id="scores"></div></header><section class="shell"><div class="board"><div class="meta"><span id="qnum">READY</span><span id="cat">KIWI FEUD</span></div><div class="question" id="question">Waiting for the host…</div><div class="answers" id="answers"></div><div class="bottom"><div class="strikes"><span class="strike">×</span><span class="strike">×</span><span class="strike">×</span></div><div class="pot"><small>ROUND POT</small><strong id="pot">0</strong><small id="formula">0 × 1</small></div><div></div></div></div></section></main><script src="game-data.js"></script><script>const $=id=>document.getElementById(id);function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(s){const q=KIWI_FEUD_BANK[s.questionIndex];$('scores').innerHTML=s.teams.map((t,i)=>`<div class="team ${s.activeTeam===i?'active':''}"><span>${esc(t.name)}</span><b>${t.score}</b></div>`).join('');document.querySelectorAll('.strike').forEach((x,i)=>x.classList.toggle('on',i<s.strikes));if(!q){$('qnum').textContent='READY';$('cat').textContent='KIWI FEUD';$('question').textContent='Waiting for the host…';$('answers').innerHTML='';$('pot').textContent='0';$('formula').textContent='0 × 1';return}$('qnum').textContent='QUESTION '+(s.questionIndex+1);$('cat').textContent=q.c;$('question').textContent=q.q;$('answers').innerHTML=q.a.map((a,i)=>`<div class="answer ${s.revealed.includes(i)?'revealed':''}"><span class="rank">${i+1}</span><span class="text">${a[0]}</span><span class="points">${a[1]}</span></div>`).join('');const base=s.revealed.reduce((n,i)=>n+(q.a[i]?.[1]||0),0),total=base*s.multiplier;$('pot').textContent=total;$('formula').textContent=`${base} × ${s.multiplier}`}KiwiSync.subscribe(render);</script></body></html>
