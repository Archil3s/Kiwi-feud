<!doctype html><html lang="en-NZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kiwi Feud — Audience</title><style>:root{--gold:#ffd24b;--red:#ef4056;--muted:#a7c3d8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:radial-gradient(circle at 50% -20%,#2d82b6,#0a2943 40%,#020810 82%);padding:12px}.stage{width:min(1280px,100%);margin:auto}header{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;margin-bottom:12px}.logo{font-size:34px}.title{min-width:0;font-size:clamp(28px,5vw,55px);font-weight:1000;color:var(--gold);text-transform:uppercase;text-shadow:0 4px #704000;white-space:normal;overflow-wrap:anywhere}.scores{display:flex;gap:10px}.team{padding:8px 13px;border-radius:13px;background:#08253e;border:2px solid transparent;min-width:120px;text-align:center;overflow:hidden}.team.active{border-color:var(--gold);box-shadow:0 0 25px #ffd24b55}.team span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.team b{display:block;color:var(--gold);font-size:28px}.shell{padding:9px;border-radius:30px;background:linear-gradient(145deg,#fff19f,#efa017 45%,#754000);box-shadow:0 0 0 3px #4d2900,0 30px 80px #0009}.board{min-height:650px;padding:22px;border-radius:22px;background:radial-gradient(circle at top,#1b689f,#082b49 55%,#041724);border:2px solid #ffffff35;display:flex;flex-direction:column}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-weight:900;letter-spacing:.12em;text-transform:uppercase;flex-wrap:wrap}.question{display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(25px,3.6vw,48px);font-weight:1000;line-height:1.12;padding:22px 12px;min-height:132px;max-width:100%;overflow-wrap:anywhere;word-break:normal;hyphens:auto}.answers{display:grid;gap:10px;width:100%}.answer{display:grid;grid-template-columns:56px minmax(0,1fr) 74px;align-items:stretch;min-height:65px;border-radius:13px;overflow:hidden;border:2px solid #ffeca2;background:linear-gradient(#19689e,#082d4d);font-weight:1000;box-shadow:inset 0 -5px #0004}.answer.revealed{background:linear-gradient(#fff08f,#efa91a);color:#251700;animation:flip .45s ease}@keyframes flip{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}.rank,.points{display:grid;place-items:center;background:#0002;font-size:24px;padding:8px}.text{min-width:0;display:flex;align-items:center;justify-content:center;text-align:center;text-transform:uppercase;font-size:clamp(16px,2vw,25px);line-height:1.12;padding:10px 12px;overflow-wrap:anywhere;word-break:normal;hyphens:auto}.answer:not(.revealed) .text,.answer:not(.revealed) .points{visibility:hidden}.bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-top:15px}.strikes{text-align:right}.strike{font-size:58px;color:#ffffff1c;font-weight:1000;text-shadow:0 4px #680000}.strike.on{color:var(--red)}.pot{text-align:center;background:#031421;border:1px solid #ffffff22;border-radius:14px;padding:9px 18px}.pot strong{display:block;color:var(--gold);font-size:30px}.pot small{color:var(--muted)}@media(max-width:700px){body{padding:7px}header{grid-template-columns:auto minmax(0,1fr);align-items:center}.scores{grid-column:1/-1;width:100%;display:grid;grid-template-columns:1fr 1fr}.team{min-width:0}.shell{padding:5px;border-radius:20px}.board{min-height:auto;padding:11px;border-radius:15px}.question{min-height:100px;font-size:clamp(21px,6vw,29px);padding:15px 6px}.answer{grid-template-columns:42px minmax(0,1fr) 55px;min-height:54px}.text{font-size:clamp(13px,4vw,17px);padding:8px 6px}.rank,.points{font-size:18px;padding:5px}.bottom{grid-template-columns:1fr}.strikes{text-align:center}}@media(max-height:760px) and (min-width:701px){.board{min-height:0;padding:14px}.question{min-height:88px;padding:12px 8px;font-size:clamp(22px,3vw,38px)}.answer{min-height:52px}.answers{gap:7px}.bottom{margin-top:9px}.strike{font-size:45px}}</style></head><body><main class="stage"><header><div class="logo">🥝</div><div class="title">Kiwi Feud</div><div class="scores"><div class="team" id="team0"><span>Kea</span><b>0</b></div><div class="team" id="team1"><span>Tūī</span><b>0</b></div></div></header><section class="shell"><div class="board"><div class="meta"><span id="qnum">READY</span><span id="cat">KIWI FEUD</span></div><div class="question" id="question">Waiting for the host…</div><div class="answers" id="answers"></div><div class="bottom"><div class="strikes"><span class="strike">×</span><span class="strike">×</span><span class="strike">×</span></div><div class="pot"><small>ROUND POT</small><strong id="pot">0</strong><small id="formula">0 × 1</small></div><div></div></div></div></section></main><script src="game-data.js"></script><script>const $=id=>document.getElementById(id);function render(s){const q=KIWI_FEUD_BANK[s.questionIndex];[0,1].forEach(i=>{const t=$('team'+i);t.querySelector('span').textContent=s.teamNames[i];t.querySelector('b').textContent=s.scores[i];t.classList.toggle('active',s.activeTeam===i)});document.querySelectorAll('.strike').forEach((x,i)=>x.classList.toggle('on',i<s.strikes));if(!q){$('qnum').textContent='READY';$('cat').textContent='KIWI FEUD';$('question').textContent='Waiting for the host…';$('answers').innerHTML='';$('pot').textContent='0';$('formula').textContent='0 × 1';return}$('qnum').textContent='QUESTION '+(s.questionIndex+1);$('cat').textContent=q.c;$('question').textContent=q.q;$('answers').innerHTML=q.a.map((a,i)=>`<div class="answer ${s.revealed.includes(i)?'revealed':''}"><span class="rank">${i+1}</span><span class="text">${a[0]}</span><span class="points">${a[1]}</span></div>`).join('');const base=s.revealed.reduce((n,i)=>n+q.a[i][1],0),total=base*s.multiplier;$('pot').textContent=total;$('formula').textContent=`${base} × ${s.multiplier}`}KiwiSync.subscribe(render);</script></body></html>
